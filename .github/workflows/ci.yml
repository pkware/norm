# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Build & test

on:
  pull_request:
  push:
    branches: [ main, release/* ]

permissions: {}

jobs:
  linux:
    name: Linux (Postgres ${{ matrix.pg-version }})
    strategy:
      fail-fast: false
      matrix:
        pg-version: [16, 17, 18]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
      pull-requests: write
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25.0.4+101.0.LTS
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0 # zizmor: ignore[cache-poisoning]

      - name: Clear Testcontainers cache
        run: rm -f ~/.testcontainers.properties

      - name: Build Norm
        run: ./gradlew build -Dnorm.test.pgVersion=${{ matrix.pg-version }}

      - name: Verify golden files are up to date
        if: matrix.pg-version == 18
        run: |
          ./gradlew :gradle-plugin:generateGoldenFiles
          git diff --exit-code -- test-scenarios/ test-scenarios-frameworks/

      - name: Build Example
        if: matrix.pg-version == 18
        run: ./gradlew build
        working-directory: example

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Test Results Linux PG ${{ matrix.pg-version }}
          path: '**/test-results/**/*.xml'

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@b7b80d7ac5b1da46d6aaff9fb57ad50d8453bcb3 # v6.6.0
        if: always()
        with:
          report_paths: '**/test-results/**/TEST-*.xml'
          check_name: Test Report (PG ${{ matrix.pg-version }})
